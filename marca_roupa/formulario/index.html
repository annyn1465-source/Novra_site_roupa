<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Moda Digital</title>
    <link rel="stylesheet" href="../formulario/style.css">
</head>
<body>
    <main class="container">
        <h1>Bershka</h1>
        <p class="subtitulo">Seja voce á vestir a marca única e estilosa.</p>

        <form id="formCadastro">
            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Digite seu nome">

            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail">

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" placeholder="Digite seu telefone">

            <label for="moda">Moda Bershka</label>
            <input type="text" id="estilo" list="listaEstilo" placeholder="Escolha ou digite o seu estilo">
            <datalist id="listaEstilo">
                <option value="Moda Feminina">
                <option value="Moda Masculina">
            </datalist>

            <label for="gosto">Gosto</label>
            <input type="text" id="gosto" placeholder="Digite seu gosto e estilo">

            <button type="submit">Cadastrar</button>
        </form>

        <p id="mensagem"></p>
    </main>

    <script src="../formulario/script.js"></script>
</body>
</html>
